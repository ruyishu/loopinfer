[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopinfer"
version = "0.1.0"
description = "Standalone inference engine for looped language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4,<3",
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
    "tokenizers>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "openai>=1"]
reference = ["transformers>=4.55,<5"]

[project.scripts]
loopinfer = "loopinfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
